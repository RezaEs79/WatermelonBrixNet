experiment_name: "Sugar_ConvNeXt"
device: "cuda"

dataset:
  root_dir: "./data/processed_dataset"
  val_split: 0.25
  batch_size: 16
  num_workers: 2
  excluded_ids: [16, 20, 23, 24, 25, 31]
  fixed_val_ids: [4, 6, 7, 12, 13, 18, 19]

model:
  name: "convnext"    # <--- newest model
  type: "regression"
  num_classes: 1

training:
  epochs: 35
  learning_rate: 0.0001 # ConvNeXt performs better with a lower learning rate
  weight_decay: 0.001
  save_dir: "./checkpoints"
  use_weighted_loss: true

audio:
  sample_rate: 96000
  duration: 1.0
  img_size: [224, 224] # <--- Critical size for ConvNeXt