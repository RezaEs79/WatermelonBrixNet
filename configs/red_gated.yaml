experiment_name: "Redness_Gated_EffV2"
device: "cuda"

dataset:
  root_dir: "./data/processed_dataset"
  val_split: 0.25
  batch_size: 12
  num_workers: 2
  excluded_ids: [16, 20, 23, 24, 25, 31]
  # 👇 Add this line. If you want a random split, remove this line or set it to [].
  fixed_val_ids: [4, 6, 7, 12, 13, 18, 19]
  # Validation IDs: [1, 9, 10, 13, 19, 27, 32]

model:
  name: "gated"
  type: "classification" # Quality classification
  num_classes: 5         # Classes 0 through 4

training:
  epochs: 40
  learning_rate: 0.0002
  weight_decay: 0.001
  save_dir: "./checkpoints"
  use_weighted_loss: true

audio:
  sample_rate: 96000
  duration: 1.0