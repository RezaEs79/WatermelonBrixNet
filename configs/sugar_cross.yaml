experiment_name: "Sugar_CrossAtt"
device: "cuda"

dataset:
  root_dir: "./data/processed_dataset"
  val_split: 0.25
  batch_size: 16
  num_workers: 2
  excluded_ids: [16, 20, 23, 24, 25, 31]
  fixed_val_ids: [4, 6, 7, 12, 13, 18, 19]

model:
  name: "cross"       # <--- مدل جدید
  type: "regression"
  num_classes: 1

training:
  epochs: 35
  learning_rate: 0.0002 # کمی پایین‌تر برای پایداری Attention
  weight_decay: 0.001
  save_dir: "./checkpoints"
  use_weighted_loss: true

audio:
  sample_rate: 96000
  duration: 1.0
  # در کد کولب سایز صدا همان 128x128 پیش‌فرض بود، پس نیازی به تغییر نیست